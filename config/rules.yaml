  short: 分红回购
  icon: 💵
  order: 9
  priority: 40
  enabled: true
  display_color: '#ca8a04'
  keywords:
  - 分红
  - 派现
  - 送转
  - 增持
  - 回购
  - 利润分配
  - 权益分派
  - 派息
  - 股份回购
  - 回购股份
  - 回购报告书
  patterns:
  - (利润|权益)分(配|派)
  - 回购(股份|报告书)
  - 增持.{0,8}(计划|进展)
