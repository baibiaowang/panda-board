# 公告全部保留入库；noise 只影响展示，风险公告优先保留。
# market_cap.cache_days=0 保留原项目的参考市值不定期刷新口径。
# kline.days 和 build.kline_bars 均为交易日K线根数。
version: 3
classify:
  multi_label: false
  default_category: other
  match_fields:
  - title
  - summary
taxonomy:
- id: delisting
  label: 退市风险
  short: 退市
  icon: ⚠️
  order: 1
  priority: 100
  enabled: true
  risk: true
  display_color: '#dc2626'
  keywords:
  - 退市
  - 退市风险
  - 终止上市
  - 面值退市
  - 财务类退市
  - 规范类退市
  - 暂停上市
  - 风险警示
  - 可能被实施退市风险警示
  - 撤销退市风险警示
  - 股票可能被终止上市
  patterns:
  - 退市风险警示
  - 终止上市
  min_amount: null
- id: restructuring
  label: 破产重整
  short: 重整
  icon: 🏗️
  order: 2
  priority: 95
  enabled: true
  risk: true
  display_color: '#7c2d12'
  keywords:
  - 重整
  - 破产
  - 破产重整
  - 破产清算
  - 预重整
  - 重整计划
  - 重整申请
  - 债务重组
  - 管理人
  patterns:
  - 重整(计划|申请|受理)
  - 预重整
  min_amount: null
- id: penalty
  label: 立案/处罚
  short: 立案处罚
  icon: 🔴
  order: 3
  priority: 90
  enabled: true
  risk: true
  display_color: '#dc2626'
  keywords:
  - 立案
  - 立案调查
  - 立案告知
  - 调查
  - 处罚
  - 行政处罚
  - 警示函
  - 监管函
  - 监管措施
  - 处分
  - 纪律处分
  - 通报批评
  - 违规
  - 违规担保
  patterns:
  - 立案(调查|告知)
  - 行政处罚
  - 监管(措施|函)
  - 警示函
  min_amount: null
- id: lawsuit
  label: 重大诉讼
  short: 诉讼
  icon: ⚖️
  order: 4
  priority: 85
  enabled: true
  risk: true
  display_color: '#b91c1c'
  keywords:
  - 诉讼
  - 仲裁
  - 起诉
  - 被诉
  - 判决
  - 重大诉讼
  - 重大仲裁
  - 诉讼进展
  patterns:
  - (重大)?(诉讼|仲裁)
  - (起诉|被诉|判决)
  min_amount: null
- id: clarify
  label: 澄清/辟谣
  short: 澄清
  icon: 🚫
  order: 5
  priority: 88
  enabled: true
  risk: false
  display_color: '#db2777'
  keywords:
  - 澄清
  - 辟谣
  - 严正声明
  - 不实信息
  - 虚假信息
  - 谣言
  - 误导性陈述
  patterns:
  - 澄清(公告|声明|说明)
  - (澄清|严正).{0,10}(声明|公告|说明)
  - (传闻|传言|媒体报道|网络传言|市场传闻|媒体传闻).{0,30}(澄清|核实|不实|虚假|否认|回应|说明|声明)
  - (不实|虚假|误导性).{0,10}(报道|信息|传闻|陈述|言论)
  min_amount: null
- id: merger
  label: 并购重组
  short: 并购
  icon: 💰
  order: 5
  priority: 80
  enabled: true
  display_color: '#2563eb'
  keywords:
  - 并购重组
  - 重大资产重组
  - 发行股份购买
  - 购买资产
  - 吸收合并
  - 收购
  - 取得控制
  - 控制权变更
  - 要约收购
