  - 回购实施结果
  - 回购股份事项
  - 回购完成
  - 章程
  - 议事规则
  - 管理制度
  - 修正案
  pledge_whitelist:
  - 控股股东
  - 第一大股东
  - 5%以上股东
  - 解除质押
  - 解押
numeric_extraction:
  money:
  - (?<![\d,.])([\d,]+(?:\.\d+)?)\s*亿元
  - (?<![\d,.])([\d,]+(?:\.\d+)?)\s*万元
  - (?<![\d,.])([\d,]+(?:\.\d+)?)\s*元
  percent:
  - (\d+(?:\.\d+)?)\s*%
  share:
  - (\d+(?:\.\d+)?)\s*万股
  - (\d+(?:\.\d+)?)\s*亿股
  max_items: 4
fetch:
  source: eastmoney
  mock:
    seed: 20260828
    pool_size: 800
    ann_per_day: 150
    kline_days: 160
  cninfo:
    columns:
    - sse
    - szse
    workers: 4
    max_pages_per_day: 1000
  kline:
    days: 160
    eastmoney_first: false
    workers: 8
    nodata_retry_days: 1
  market_cap:
    enabled: true
    cache_days: 0
    batch_size: 60
    workers: 4
  eastmoney:
    page_size: 100
    max_pages_per_day: 120
    ann_type: A
    sleep: 0.35
    probe_workers: 4
    day_workers: 4
  scan_days: 90
  days_per_run: 12
  lookback_days: 2
network:
  timezone: Asia/Shanghai
  connect_timeout: 10
  read_timeout: 25
  max_attempts: 3
  backoff_base: 2.0
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/126.0 Safari/537.36
  proxy: null
  proxy_env_fallback: true
  verify_ssl: true
  conn_pool_size: 8
  allow_http_fallback: false
  max_response_bytes: 16777216
display:
  max_announcements_per_stock: 0
build:
  kline_bars: 120
