  - 收购.{0,15}(股权|资产)
  - 控制权(变更|转让)
  min_amount: null
- id: disposal
  label: 出售/转让
  short: 出售转让
  icon: 📦
  order: 6
  priority: 70
  enabled: true
  display_color: '#7c3aed'
  keywords:
  - 出售
  - 转让
  - 剥离
  - 挂牌
  - 清仓
  - 股权转让
  - 资产处置
  - 出售子公司
  - 公开挂牌
  patterns:
