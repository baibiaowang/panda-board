  min_amount: null
- id: other
  label: 其他公告
  short: 其他
  icon: 📄
  order: 99
  priority: 0
  enabled: true
  display_color: '#6b7280'
  keywords: []
  patterns: []
  min_amount: null
noise:
  enabled: true
  titles:
  - 限制性股票
  - 回购注销
  - 回购价格
  - 行权价格
  - 法律意见书
  - 前十大股东
